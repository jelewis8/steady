# Steady on an existing Apache server.
# Upload to /etc/apache2/sites-available/steady.conf (NOT sites-enabled), then:
#   a2enmod headers && a2ensite steady && apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d steady.example.com
# certbot copies this block into steady-le-ssl.conf, so the headers apply over HTTPS too.
# The address must match your other sites on this server (IP-based, not *:80),
# otherwise requests to the public IP never reach this vhost.

<VirtualHost 203.0.113.10:80>
    ServerName steady.example.com
    DocumentRoot /var/www/steady/current

    <Directory /var/www/steady>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Single-page app: unknown paths serve the app shell
    DirectoryIndex index.html
    FallbackResource /index.html

    AddType application/manifest+json .webmanifest

    # connect-src 'self' is the technical guarantee that no data leaves the device
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Header always set Permissions-Policy "microphone=(self), geolocation=(self), camera=(), payment=(), usb=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set X-Frame-Options "DENY"

    # Fingerprinted assets never change; the shell, service worker and manifest must revalidate
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "^(index\.html|sw\.js|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # No visitor logs for this site
    CustomLog /dev/null combined
    ErrorLog ${APACHE_LOG_DIR}/steady-error.log
</VirtualHost>
